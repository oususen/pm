# 新本番PC(PC2)専用: PM専用MySQLを追加する。起動: docker compose -f docker-compose.yml -f docker-compose.pc2.yml up -d --build
# 旧本番PCでは共通MySQLコンテナを使うため、このファイルは配置しない（コミット対象外）。
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-pm_db}
      - TZ=Asia/Tokyo
    volumes:
      - pm_mysql_data:/var/lib/mysql
    networks:
      - pm_internal
      - ts_pm_network_v2

  pm-backend:
    depends_on:
      - mysql

volumes:
  pm_mysql_data:
