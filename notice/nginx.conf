# 旧本番の案内ページ用nginx(PM移転のお知らせ)。どのURLを開いても案内ページを返し、ログイン・APIは使えない。
server {
    listen 8501 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/pm-prod.crt;
    ssl_certificate_key /etc/nginx/ssl/pm-prod.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # ダウンロード(APK・証明書)。旧本番の pm-ui/public/downloads と同じ場所
    location ^~ /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/x-x509-ca-cert crt;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # APIは使えない(ログイン不可)。アプリや旧画面からの呼び出しには、移転の案内を返す
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"detail":"PMは新しいアドレス https://10.0.1.139:8501 に移転しました。こちらではご利用になれません。"}';
    }

    # それ以外はすべて案内ページ(/login などのURLでも同じ)
    location / {
        add_header Cache-Control "no-store";
        try_files /notice.html =404;
    }
}
