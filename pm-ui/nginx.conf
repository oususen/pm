# HTTPS サーバー（ポート8501）
server {
    listen 8501 ssl;
    server_name localhost;

    # SSL証明書
    ssl_certificate /etc/nginx/ssl/pm-prod.crt;
    ssl_certificate_key /etc/nginx/ssl/pm-prod.key;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # gzip圧縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown;

    # マニュアル（Markdown）ファイル - 実際のファイルのみ配信
    location ~ ^/manual/(.+\.(md|png|jpg|jpeg|gif))$ {
        alias /usr/share/nginx/html/manual/$1;
        add_header Cache-Control "no-cache";
        types {
            text/markdown md;
        }
    }

    # /manual または /manual/ はVue SPAにフォールバック
    location = /manual {
        try_files /index.html =404;
    }
    location = /manual/ {
        try_files /index.html =404;
    }

    # Allow larger uploads (avoid 413)
    client_max_body_size 50m;
    client_body_buffer_size 50m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # HTML（キャッシュなし - 常に最新を取得）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Expires "0";
        add_header Pragma "no-cache";
    }

    # PWA manifest
    location ~* \.webmanifest$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types {
            application/manifest+json webmanifest;
        }
    }

    # Service Worker（キャッシュなし）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        types {
            application/javascript js;
        }
    }

    # 静的ファイル（Django admin用）- Nginxが直接配信
    # ^~ modifier ensures this takes precedence over regex locations
    location ^~ /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # メディアファイル（Nginxが直接配信）
    # ^~ modifier ensures this takes precedence over regex locations
    location ^~ /media/ {
        alias /app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # APIリクエストをバックエンドにプロキシ
    location /api/ {
        proxy_pass http://pm-backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cookie_path / /;
    }

    # その他のキャッシュ設定
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router用（SPA対応）- 最後
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
