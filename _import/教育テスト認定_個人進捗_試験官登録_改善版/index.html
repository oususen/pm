<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教育・テスト・認定・日程 管理アプリ</title>
<meta name="theme-color" content="#0f766e">
<style>
:root{
 --bg:#f4f7f8;--panel:#fff;--text:#16202a;--muted:#667085;--line:#dfe5e8;
 --primary:#0f766e;--primary2:#0b5f59;--soft:#e8f5f3;--good:#16794a;--goodbg:#eaf8f0;
 --bad:#b42318;--badbg:#fff0ef;--warn:#9a6700;--warnbg:#fff8e5;--blue:#175cd3;--bluebg:#eff4ff;
 --shadow:0 10px 30px rgba(21,31,44,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(180deg,#eaf5f3 0,var(--bg) 280px);color:var(--text);line-height:1.65}
button,input,select{font:inherit}
button{touch-action:manipulation}
.appbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.appbar-inner{max-width:1240px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:var(--shadow)}
.brand-title{font-weight:900;font-size:17px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-3px}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.container{max-width:1240px;margin:auto;padding:18px 16px 70px}
.hero,.panel,.card,.summary,.profilebar{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero{border-radius:22px;padding:22px;margin:10px 0 18px}
.hero h1{font-size:clamp(25px,4vw,40px);line-height:1.25;margin:4px 0 8px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.panel{border-radius:18px;padding:18px}
.card{border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(20,26,40,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.book-card{cursor:pointer;transition:.16s transform,.16s box-shadow,.16s border-color}
.book-card:hover{transform:translateY(-2px);border-color:#8bcac2;box-shadow:var(--shadow)}
.book-title{font-size:18px;font-weight:900;margin:4px 0 8px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.section-title h2{font-size:22px;margin:0}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid transparent;background:var(--primary);color:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:850;min-height:42px}
.btn:hover{background:var(--primary2)}
.btn.secondary{background:#fff;color:var(--text);border-color:var(--line)}
.btn.secondary:hover{background:#f4f6f7}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0b8b3}
.btn.danger:hover{background:var(--badbg)}
.btn.good{background:var(--good)}
.btn.good:hover{filter:brightness(.94)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fbfcfc;color:#3d4754;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800}
.badge.primary{background:var(--soft);border-color:#b8dfda;color:var(--primary2)}
.badge.good{background:var(--goodbg);border-color:#bce3cb;color:var(--good)}
.badge.warn{background:var(--warnbg);border-color:#efd695;color:var(--warn)}
.badge.bad{background:var(--badbg);border-color:#efc0bc;color:var(--bad)}
.badge.blue{background:var(--bluebg);border-color:#c9d7ff;color:var(--blue)}
.meta,.small{color:var(--muted)}
.meta{font-size:14px}.small{font-size:12px}
.notice{background:#f7fbfb;border:1px solid #cfe5e2;border-left:4px solid var(--primary);padding:11px 13px;border-radius:10px;margin:12px 0}
.warnbox{background:var(--warnbg);border:1px solid #eed596;padding:11px 13px;border-radius:10px;margin:12px 0;color:#6e4b00}
.profilebar{border-radius:18px;padding:16px;margin-bottom:18px}
.profile-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.field input,.field select,.searchbox{width:100%;border:1px solid #cfd8dc;border-radius:11px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.searchbox:focus{border-color:#5cb6ab;box-shadow:0 0 0 3px rgba(15,118,110,.10)}
.profile-note{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}
.progress-table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.progress-table{width:100%;border-collapse:separate;border-spacing:0;min-width:790px}
.progress-table th,.progress-table td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
.progress-table th{background:#f4f8f8;color:#44505e;font-size:13px;position:sticky;top:63px;z-index:3}
.progress-table th:nth-child(2),.progress-table td:nth-child(2){text-align:left}
.progress-table tr:last-child td{border-bottom:0}
.status-dot{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-size:20px;font-weight:900;border:2px solid #cfd8dc;background:#fff;color:#98a2b3}
.status-dot.done{background:var(--good);border-color:var(--good);color:#fff}
.status-dot.na{border-color:#e4e7ec;background:#f7f8fa;color:#98a2b3}
.stepcell .small{display:block;margin-top:5px;max-width:190px}
.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:16px;align-items:start}
.sidebar{position:sticky;top:76px}
.summary{border-radius:18px;padding:16px}
.kv{display:grid;gap:9px;margin:12px 0}
.kv>div{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.kv span{color:var(--muted);font-size:12px}.kv b{text-align:right}
.progress{height:10px;background:#edf1f2;border-radius:999px;overflow:hidden;margin:7px 0}
.progress>div{height:100%;background:var(--primary)}
.score{font-size:40px;font-weight:950;line-height:1.15;margin-top:12px}
.question-card{margin-bottom:13px;break-inside:avoid}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q-num{display:inline-grid;place-items:center;min-width:42px;height:34px;border-radius:10px;background:var(--primary);color:#fff;font-weight:900;margin-right:5px}
.q-text{font-size:18px;font-weight:800;margin:14px 0 10px;white-space:pre-wrap}
.options{display:grid;gap:8px;margin-top:10px}
.option{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;text-align:left;gap:9px;background:#fff;border:1px solid #d8e0e3;border-radius:13px;padding:11px;cursor:pointer;color:var(--text)}
.option:hover{background:#f7fbfb;border-color:#99cec7}
.option.selected{border:2px solid var(--primary);background:var(--soft)}
.option.correct{border-color:#67ba87;background:var(--goodbg)}
.option.wrong{border-color:#df7c74;background:var(--badbg)}
.opt-key{width:34px;height:34px;border-radius:9px;background:#eef2f3;display:grid;place-items:center;font-weight:900}
.opt-text{font-weight:700;white-space:pre-wrap}
.result-box{border-radius:12px;padding:12px;margin-top:12px}
.result-box.good{background:var(--goodbg);border:1px solid #bfe3cc}
.result-box.bad{background:var(--badbg);border:1px solid #efc0bc}
.history-list{display:grid;gap:10px}
.history-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}
.history-title{font-weight:900}
.empty{padding:38px 18px;text-align:center;color:var(--muted)}
.evidence{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.evidence-title{text-align:center;border-bottom:3px double #333;padding-bottom:10px;margin-bottom:14px}
.evidence-title h1{font-size:25px;margin:0}
.info-table,.result-table{width:100%;border-collapse:collapse}
.info-table th,.info-table td,.result-table th,.result-table td{border:1px solid #7c8388;padding:7px 8px;vertical-align:top}
.info-table th{width:14%;background:#f0f2f3;text-align:left}
.result-table th{background:#eceff1;font-size:12px}
.result-table td{font-size:12px}
.e-q{font-weight:800;white-space:pre-wrap}
.e-choice{margin-top:5px;color:#344054;white-space:pre-wrap}
.e-result-good{font-weight:900;color:var(--good)}
.e-result-bad{font-weight:900;color:var(--bad)}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.sign-box{border:1px solid #555;min-height:85px;padding:8px}
.hidden{display:none!important}

/* 教育進捗日程カレンダー */
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.calendar-month{font-size:26px;font-weight:950;letter-spacing:.02em}
.calendar-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.calendar{min-width:920px;display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));background:var(--line);gap:1px}
.cal-weekday{background:#eef5f4;padding:9px;text-align:center;font-size:13px;font-weight:900;color:#46525f;position:sticky;top:63px;z-index:4}
.cal-day{background:#fff;min-height:154px;padding:8px;cursor:pointer;transition:.12s background;overflow:hidden}
.cal-day:hover{background:#f7fbfb}
.cal-day.outside{background:#f7f8f9;color:#98a2b3}
.cal-day.today{box-shadow:inset 0 0 0 3px var(--primary)}
.cal-date-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}
.cal-date{font-weight:950;font-size:15px}
.cal-count{font-size:11px;color:var(--muted);font-weight:800}
.schedule-card{display:block;width:100%;border:1px solid #cfdedc;border-left:5px solid var(--primary);border-radius:9px;background:#f8fcfb;padding:6px 7px;margin:5px 0;text-align:left;color:var(--text);cursor:pointer;line-height:1.35}
.schedule-card:hover{background:var(--soft)}
.schedule-card.completed{border-color:#85cda5;border-left:6px solid var(--good);background:#dff5e8;box-shadow:inset 0 0 0 1px rgba(22,121,74,.05)}
.schedule-card.completed .schedule-name{color:#0f6039}
.schedule-card.partial{border-color:#efd695;border-left:6px solid var(--warn);background:var(--warnbg)}
.schedule-card.overdue{border-color:#efc0bc;border-left:6px solid var(--bad);background:var(--badbg)}
.schedule-name{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-meta{font-size:10.5px;color:#52606d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schedule-step{display:inline-block;font-size:10px;font-weight:900;border:1px solid #b8d9d5;border-radius:999px;padding:1px 5px;margin-right:3px;background:#fff;color:var(--primary2)}
.schedule-more{font-size:11px;color:var(--muted);font-weight:850;margin-top:5px}
.schedule-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.schedule-form .wide{grid-column:1/-1}
.schedule-list{display:grid;gap:10px}
.schedule-detail{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}
.picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.trainee-picker,.step-picker{display:flex;flex-wrap:wrap;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fafb;min-height:48px}
.check-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #cfd8dc;border-radius:999px;background:#fff;padding:7px 11px;font-size:13px;font-weight:850;cursor:pointer;user-select:none}
.check-chip:has(input:checked){border-color:#5cb6ab;background:var(--soft);color:var(--primary2);box-shadow:0 0 0 2px rgba(15,118,110,.06)}
.check-chip input{width:17px;height:17px;accent-color:var(--primary);margin:0}
.quick-row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
.quick-btn{border:1px solid #b8dfda;background:#fff;color:var(--primary2);border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:850;font-size:12px}
.quick-btn:hover{background:var(--soft)}
.trainee-master-list{display:grid;gap:7px;margin-top:10px}
.trainee-master-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff}
.trainee-master-item b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.legend-line.warn{background:var(--warn)}
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(16,24,40,.48);display:grid;place-items:center;padding:16px}
.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.25);padding:19px}
.modal h2{margin:0 0 12px;font-size:22px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend-item{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
.legend-line{width:5px;height:20px;border-radius:99px;background:var(--primary)}
.legend-line.good{background:var(--good)}
.legend-line.bad{background:var(--bad)}
@media(max-width:580px){.schedule-form{grid-template-columns:1fr}.calendar-month{font-size:21px}.modal{padding:15px}.calendar-toolbar .actions{width:100%}.calendar-toolbar .actions .btn{flex:1}}

@media(max-width:900px){
 .profile-grid{grid-template-columns:1fr 1fr}
 .exam-layout{grid-template-columns:1fr}.sidebar{position:static}
 .nav .btn{padding:8px 10px;min-height:38px}
}
@media(max-width:580px){
 .container{padding-left:10px;padding-right:10px}
 .appbar-inner{align-items:flex-start}.brand-sub{display:none}.brand-title{font-size:14px}
 .nav{justify-content:flex-end}.nav .btn{font-size:12px;padding:7px 9px}
 .profile-grid{grid-template-columns:1fr}
 .hero{padding:17px}.hero h1{font-size:26px}
 .history-item{grid-template-columns:1fr}
 .q-text{font-size:17px}
 .progress-table th{top:60px}
}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff;color:#000;font-family:"Yu Gothic","Meiryo",sans-serif}
 .appbar,.no-print,.profilebar{display:none!important}
 .container{max-width:none;padding:0}
 #app{padding:0}
 .evidence{border:0;box-shadow:none;border-radius:0;padding:0}
 .evidence-title h1{font-size:20px}
 .info-table th,.info-table td{font-size:10px;padding:5px}
 .result-table th,.result-table td{font-size:9px;padding:4px}
 .evidence-question{break-inside:avoid}
 .sign-row{break-inside:avoid}
}
</style>
</head>
<body>
<header class="appbar no-print">
  <div class="appbar-inner">
    <div class="brand">
      <div class="logo">教</div>
      <div><div class="brand-title">教育・テスト・認定・日程 管理</div><div class="brand-sub">問題集はExcel内容を保持・個人別進捗管理</div></div>
    </div>
    <nav class="nav">
      <button class="btn secondary" onclick="goHome()">問題集</button>
      <button class="btn secondary" onclick="renderProgress()">推進状況</button>
      <button class="btn secondary" onclick="renderSchedule()">進捗日程</button>
      <button class="btn secondary" onclick="renderHistory()">履歴</button>
    </nav>
  </div>
</header>
<main class="container">
  <div id="profile"></div>
  <div id="app"></div>
</main>

function byId(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function nowLocalValue(){
 const d=new Date(),p=n=>String(n).padStart(2,"0");
 return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDateTime(v){
 if(!v)return "";
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return v;
 return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d);
}
function pad2(n){return String(n).padStart(2,"0")}
function dateKey(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function parseDateKey(v){const [y,m,d]=String(v||"").split("-").map(Number);return new Date(y,m-1,d)}
function fmtDate(v){if(!v)return "";const d=parseDateKey(v);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function shortTrackTitle(title){return String(title||"").replace(/【[^】]+】/g,"").replace(/DMS[「『]/,"DMS ").replace(/[」』]/g,"")}
function uid(prefix="id"){return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`}
function loadJson(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch(e){return fallback}}
function saveJson(key,v){localStorage.setItem(key,JSON.stringify(v))}
function getProfile(){
 const p=loadJson(STORAGE.profile,{});
 return {performedAt:p.performedAt||nowLocalValue(),location:p.location||"",trainee:p.trainee||"",supervisor:p.supervisor||""};
}
function saveProfile(){
 const els=["performedAt","location","trainee","supervisor"];
 const p={};els.forEach(k=>{const e=byId(k);if(e)p[k]=e.value.trim()});
 if(!p.performedAt)p.performedAt=nowLocalValue();
 saveJson(STORAGE.profile,p);renderProfile();
}
function profileComplete(p=getProfile()){return !!(p.performedAt&&p.location&&p.trainee&&p.supervisor)}
function renderProfile(){
 const p=getProfile();
 byId("profile").innerHTML=`
 <section class="profilebar no-print">

    <div class="field"><label>誰が（受講者）</label><input id="trainee" list="traineeOptions" value="${esc(p.trainee)}" placeholder="登録者から選択" onchange="saveProfile()"><datalist id="traineeOptions">${getTrainees().map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>
    <div class="field"><label>先生・試験官（監督者）</label><input id="supervisor" list="supervisorOptions" value="${esc(p.supervisor)}" placeholder="登録者から選択" onchange="saveProfile()"><datalist id="supervisorOptions">${getSupervisors().map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist></div>
   </div>
   <div class="profile-note"><span class="small">試験結果PDF・推進履歴にこの情報を記録します。</span><div class="actions"><button class="btn secondary" onclick="openTraineeMaster(false)">受講者登録</button><button class="btn secondary" onclick="openSupervisorMaster(false)">試験官登録</button><button class="btn secondary" onclick="saveProfile()">入力内容を保存</button></div></div>
 </section>`;
}
function requireProfile(){
 saveProfile();
 const p=getProfile();
 if(profileComplete(p))return true;
 alert("実施情報の「いつ・どこで・受講者・試験監督者」をすべて入力してください。");
 window.scrollTo({top:0,behavior:"smooth"});return false;
}
function getBook(id=state.bookId){return APP_DATA.books.find(b=>b.id===id)}
function qMap(book){const m=new Map();book.questions.forEach(q=>m.set(q.id,q));return m}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalizeAnswerParts(answer){return String(answer??"").split(",").map(x=>x.trim()).filter(Boolean)}
function resolveCorrectValues(q){
 const parts=normalizeAnswerParts(q.answer);
 if(!q.choices||q.choices.length===0)return parts;
 return parts.map(p=>{
  const byValue=q.choices.find(c=>String(c.value).trim()===p);if(byValue)return String(byValue.value).trim();
  const byText=q.choices.find(c=>String(c.text).trim()===p||String(c.raw).trim()===p);if(byText)return String(byText.value).trim();
  return p;
 });
}
function isMulti(q){return normalizeAnswerParts(q.answer).length>1}
function isCorrect(q,selected){
 const s=(selected||[]).map(String).map(x=>x.trim()).filter(Boolean).sort();
 const c=resolveCorrectValues(q).map(String).map(x=>x.trim()).filter(Boolean).sort();
 return s.length===c.length&&s.every((v,i)=>v===c[i]);
}
function answerLabel(q,values){
 if(!values||values.length===0)return "未回答";
 return values.map(v=>{const opt=(q.choices||[]).find(c=>String(c.value)===String(v));if(!opt)return v;const t=String(opt.text||opt.raw||"");if(["○","×"].includes(t))return t;return String(opt.value)}).join(", ");
}
function correctLabel(q){return answerLabel(q,resolveCorrectValues(q))}
function optionIsCorrect(q,opt){return resolveCorrectValues(q).map(String).includes(String(opt.value))}
function optionIsSelected(q,opt){return(state.answers[q.id]||[]).map(String).includes(String(opt.value))}
function attemptKey(){return `trainingApp:working:${state.bookId}:${state.examName}:${state.sessionId}`}
function saveWorking(){if(!state.bookId||!state.examName||!state.sessionId)return;saveJson(attemptKey(),{answers:state.answers,graded:state.graded,recordedAttemptId:state.recordedAttemptId})}
function setSingleAnswer(qid,val){state.answers[qid]=[val];saveWorking();renderQuiz()}
function toggleMultiAnswer(qid,val){const cur=state.answers[qid]||[];const exists=cur.map(String).includes(String(val));state.answers[qid]=exists?cur.filter(x=>String(x)!==String(val)):cur.concat([val]);saveWorking();renderQuiz()}
function getCurrentQuestions(){const b=getBook(),map=qMap(b);return state.ids.map(id=>map.get(id)).filter(Boolean)}
function isFormalExam(){const ex=getBook()?.exams.find(e=>e.name===state.examName);return !!ex&&!ex.bankAll}
function grade(){

 return `<button class="schedule-card ${cls}" onclick="openScheduleDetail('${sc.id}',event)" title="${esc(sc.trainee)} / ${esc(t?.title||sc.trackTitle)} / ${esc(scheduleStepsLabel(sc))}"><div class="schedule-name">${status==="completed"?"完了〇 ":status==="partial"?`${done}/${total} `:""}${esc(sc.trainee)}</div><div class="schedule-meta"><span class="schedule-step">${esc(scheduleStepsLabel(sc))}</span>${sc.time?esc(sc.time)+" ":""}${esc(shortTrackTitle(t?.title||sc.trackTitle))}</div></button>`;
}
function renderSchedule(){
 state.view="schedule";renderProfile();const base=new Date(state.calendarDate||new Date());base.setDate(1);state.calendarDate=base;
 const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=42,schedules=getSchedules().slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));
 let cells="";
 for(let i=0;i<days;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d),items=schedules.filter(sc=>sc.date===key),inside=d.getMonth()===m,today=key===dateKey(new Date()),show=items.slice(0,5);cells+=`<div class="cal-day ${inside?"":"outside"} ${today?"today":""}" onclick="openScheduleModal('${key}')"><div class="cal-date-row"><span class="cal-date">${d.getDate()}</span>${items.length?`<span class="cal-count">${items.length}件</span>`:""}</div>${show.map(renderScheduleCard).join("")}${items.length>5?`<div class="schedule-more">ほか ${items.length-5}件</div>`:""}</div>`}
 const monthItems=schedules.filter(sc=>{const d=parseDateKey(sc.date);return d.getFullYear()===y&&d.getMonth()===m}),completed=monthItems.filter(scheduleCompleted).length,partial=monthItems.filter(sc=>scheduleStatus(sc)==="partial").length,overdue=monthItems.filter(sc=>scheduleStatus(sc)==="overdue").length;
 byId("app").innerHTML=`<section class="hero"><div class="actions"><button class="btn secondary" onclick="goHome()">← 問題集へ戻る</button><button class="btn secondary" onclick="renderProgress()">推進状況</button></div><h1>教育進捗日程</h1><p>登録済み受講者を選び、教育・テスト・認定をまとめて予定登録できます。実績が完了するとカレンダーの予定カードが緑色の「完了〇」に変わります。</p><div class="badge-row"><span class="badge primary">登録者 ${getTrainees().length}名</span><span class="badge primary">今月 ${monthItems.length}件</span><span class="badge good">完了 ${completed}件</span>${partial?`<span class="badge warn">一部完了 ${partial}件</span>`:""}${overdue?`<span class="badge bad">予定超過 ${overdue}件</span>`:""}</div></section>
 <div class="calendar-toolbar"><div class="actions"><button class="btn secondary" onclick="changeCalendarMonth(-1)">← 前月</button><button class="btn secondary" onclick="calendarToday()">今月</button><button class="btn secondary" onclick="changeCalendarMonth(1)">次月 →</button></div><div class="calendar-month">${y}年 ${m+1}月</div><div class="actions"><button class="btn secondary" onclick="openTraineeMaster(false)">受講者登録</button><button class="btn secondary" onclick="openSupervisorMaster(false)">試験官登録</button><button class="btn" onclick="openScheduleModal('${dateKey(new Date())}')">＋ 予定を追加</button></div></div>
 <div class="legend"><span class="legend-item"><i class="legend-line"></i>予定</span><span class="legend-item"><i class="legend-line warn"></i>一部完了</span><span class="legend-item"><i class="legend-line good"></i>実施完了〇</span><span class="legend-item"><i class="legend-line bad"></i>予定日超過・未完了</span><span class="small">日付をクリックして予定追加 / 予定カードをクリックして詳細</span></div><div style="height:10px"></div>
 <div class="calendar-wrap"><div class="calendar">${["日","月","火","水","木","金","土"].map(x=>`<div class="cal-weekday">${x}</div>`).join("")}${cells}</div></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}

  return `<tr>

   <td class="stepcell"><span class="status-dot ${cert?"done":""}">${cert?"〇":"—"}</span>${cert?`<span class="small">${esc(fmtDateTime(cert.performedAt))}<br>${esc(cert.supervisor)}</span>`:`<span class="small"><button class="btn secondary" ${canCert?"":"disabled"} onclick="setManualStep('${t.id}','認定')">認定完了</button></span>`}</td>
  </tr>`;

 </section>

 const ex=b.exams.find(e=>e.name===state.examName),p=getProfile();
 let filtered=questions;if(state.search){const key=state.search.toLowerCase();filtered=questions.filter(q=>[q.id,q.category,q.question,q.type,q.level].some(x=>String(x||"").toLowerCase().includes(key)))}

function renderQuestion(q,num){
 const multi=isMulti(q),selected=state.answers[q.id]||[],correctNow=isCorrect(q,selected);
 return `<div class="card question-card" id="q-${esc(q.id)}">
  <div class="q-head"><div><span class="q-num">Q${num}</span><span class="badge">${esc(q.id)}</span>${q.category?`<span class="badge">${esc(q.category)}</span>`:""}${q.type?`<span class="badge">${esc(q.type)}</span>`:""}${q.level?`<span class="badge">${esc(q.level)}</span>`:""}</div>${state.graded?`<span class="badge ${correctNow?"good":"bad"}">${correctNow?"正解":"不正解"}</span>`:""}</div>
  <div class="q-text">${esc(q.question)}</div>
  ${multi?'<div class="notice">複数選択です。該当するものをすべて選んでください。</div>':""}
  <div class="options">${(q.choices||[]).map(opt=>{const sel=optionIsSelected(q,opt),corr=optionIsCorrect(q,opt),wrong=state.graded&&sel&&!corr,cls=["option",sel?"selected":"",state.graded&&corr?"correct":"",wrong?"wrong":""].join(" ");const click=multi?`toggleMultiAnswer('${esc(q.id)}','${esc(opt.value)}')`:`setSingleAnswer('${esc(q.id)}','${esc(opt.value)}')`;return `<button class="${cls}" onclick="${click}"><span class="opt-key">${esc(opt.value)}</span><span class="opt-text">${esc(opt.text)}</span></button>`}).join("")}</div>
  ${state.graded?`<div class="result-box ${correctNow?"good":"bad"}"><b>${correctNow?"正解です。":"見直しが必要です。"}</b><br>あなたの回答：${esc(answerLabel(q,selected))}<br>正答：${esc(correctLabel(q))}${q.explanation?`<hr style="border:0;border-top:1px solid rgba(0,0,0,.08);margin:10px 0"><b>解説</b><br>${esc(q.explanation)}`:""}</div>`:""}
 </div>`;
}

   <tr><th>判定</th><td colspan="3"><b class="${rec.result==="合格"?"e-result-good":"e-result-bad"}">${esc(rec.result)}</b>　合格基準：全問正解（100％）</td></tr>
