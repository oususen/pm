version: '3.8'

services:
  # Django Backend
  pm-backend:
    build:
      context: ./pm_backend
      dockerfile: Dockerfile
    container_name: pm_backend_prod
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-pm_db}
      - AI_DB_HOST=${AI_DB_HOST:-mysql}
      - AI_DB_PORT=${AI_DB_PORT:-3306}
      - AI_DB_NAME=${AI_DB_NAME:-pm_db}
      - AI_DB_USER=${AI_DB_USER:-pm_ai_reader}
      - AI_DB_PASSWORD=${AI_DB_PASSWORD}
      - AI_DB_SSL_CA=${AI_DB_SSL_CA}
      - AI_DB_SSL_CERT=${AI_DB_SSL_CERT}
      - AI_DB_SSL_KEY=${AI_DB_SSL_KEY}
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT}
      - FCM_SERVICE_ACCOUNT_FILE=/app/firebase-service-account.json
    ports:
      - "8081:8081"
    volumes:
      - ./pm_backend/media:/app/media
      - pm_static_volume:/app/staticfiles
      - ./output:/app/output
      - ./pm_backend/logs:/app/logs
      - ./pm_backend/vapid_private.pem:/app/vapid_private.pem:ro
      - ./pm_backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8081 --workers 3 --timeout 600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pm_internal
      - ts_pm_network_v2

  # Scheduler (APScheduler - 定時タスク実行)
  pm-scheduler:
    image: pm-pm-backend:latest
    container_name: pm_scheduler_prod
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-pm_db}
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./pm_backend/logs:/app/logs
    command: python manage.py run_scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pm-backend
    networks:
      - pm_internal
      - ts_pm_network_v2

  # Frontend (Nginx + HTTPS)
  pm-frontend:
    build:
      context: ./pm-ui
      dockerfile: Dockerfile
    container_name: pm_frontend_prod
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./pm-ui/certs:/etc/nginx/ssl:ro
      - pm_static_volume:/app/staticfiles:ro
      - ./pm_backend/media:/app/media:ro
      - ./pm-ui/public/downloads:/usr/share/nginx/html/downloads:ro
      - ./pm-ui/public/manual:/usr/share/nginx/html/manual:ro
    depends_on:
      - pm-backend
    networks:
      - pm_internal
      - ts_pm_network_v2

volumes:
  pm_static_volume:

networks:
  pm_internal:
    driver: bridge
  ts_pm_network_v2:
    external: true
